<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5D48;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow192" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#C49A28;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C49A28;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Round background -->
  <rect width="192" height="192" rx="45" fill="url(#grad192)"/>
  
  <!-- Glow effect -->
  <circle cx="96" cy="96" r="85" fill="url(#glow192)"/>
  
  <!-- Inner circle border -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="#C49A28" stroke-width="2" opacity="0.6"/>
  
  <!-- Wird text in Arabic - وird -->
  <text x="96" y="110" font-family="Amiri, Georgia, serif" font-size="72" font-weight="bold" fill="#C49A28" text-anchor="middle" dominant-baseline="middle">وird</text>
  
  <!-- Decorative dots -->
  <circle cx="60" cy="60" r="4" fill="#C49A28" opacity="0.4"/>
  <circle cx="132" cy="60" r="4" fill="#C49A28" opacity="0.4"/>
</svg>