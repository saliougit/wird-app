<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Green gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5D48;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="45" fill="url(#grad)"/>
  
  <!-- Gold circle -->
  <circle cx="96" cy="96" r="75" fill="#C49A28" opacity="0.9"/>
  
  <!-- Arabic Waw (و) -->
  <text x="96" y="125" font-family="Amiri, Georgia, serif" font-size="90" font-weight="bold" fill="#F5EDD6" text-anchor="middle" dominant-baseline="middle">و</text>
</svg>